plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvweather'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvweather'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB, never published: sign with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
